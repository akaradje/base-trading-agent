version: "3.8"

services:
  basebot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: base-trading-agent
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      # State persistence — portfolio.json + heartbeat.json
      - ../state:/app/state
      # Config (mount read-only)
      - ../config.yaml:/app/config.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1  # Real-time log output
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys,json,time; d=json.load(open('state/heartbeat.json')); sys.exit(0 if time.time()-d['unix_ts']<300 and d['status']!='error' else 1)"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
